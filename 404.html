*{box-sizing:border-box}
body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--kagit); color:var(--murekkep);

p{ color:var(--soluk); margin:0 0 22px; line-height:1.6; }
.d{ display:inline-block; margin:4px; padding:11px 20px; border-radius:10px; text-decoration:none; font-weight:700; font-size:14px; }
.b{ background:var(--murekkep); color:var(--kagit); }
.i{ border:1px solid var(--cizgi); color:var(--murekkep); }
small{ display:block; margin-top:26px; color:var(--sisik); font-size:12.5px; }
</style>
</head>
